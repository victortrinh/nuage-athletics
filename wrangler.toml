# Cloudflare Workers (static assets + SSR endpoints).
# Astro 7's Cloudflare adapter targets Workers, not Pages — do not add
# `pages_build_output_dir`, it makes wrangler treat this as a Pages project
# and the reserved ASSETS binding then fails the build.

name = "nuage-athletics"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "nuage-athletics"
database_id = "45e7063a-4ac5-49d8-a594-950eb49fd40e"
migrations_dir = "migrations"

[vars]
PUBLIC_SITE_URL = "https://nuageathletics.com"
# The Shopify store, host only — no scheme, no path. Deliberately a var and
# not a secret: it is public on every storefront URL, and as a secret it was
# one more thing that could be missing from a Worker version while the page
# quietly rendered as if the drop hadn't opened (see X-Storefront in
# src/lib/commerce/index.ts). Here it ships with the code and cannot go
# missing. The token beside it stays a secret — that one is a credential.
SHOPIFY_STORE_DOMAIN = "nuage-athletics-dev.myshopify.com"
# "true" shows prices and the buy flow to everyone. Keep this "false" until
# the drop: while it is off, only a visitor carrying the preview cookie sees
# them — see src/lib/commerce/index.ts. It permits a price; it does not supply
# one. Without the Shopify secrets below there is nothing to render either way.
COMMERCE_ENABLED = "false"

# Secrets — set with `wrangler secret put <NAME>`, never commit:
#   RESEND_API_KEY
#   PREVIEW_PASSWORD
#   SHOPIFY_STOREFRONT_TOKEN  (Storefront API access token, read scopes)
#   SHOPIFY_WEBHOOK_SECRET    (order-paid webhook signing secret, from the Shopify admin subscription)
#
# SHOPIFY_STORE_DOMAIN is a [vars] entry above, not a secret. If one was ever
# set with `wrangler secret put`, delete it (`wrangler secret delete
# SHOPIFY_STORE_DOMAIN`) so there is one place the domain comes from.

# The Cloudflare adapter enables Astro sessions backed by KV and expects a
# "SESSION" binding.
[[kv_namespaces]]
binding = "SESSION"
id = "f23256bb893b4d8f81062c7fe55fac1f"
